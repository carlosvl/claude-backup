<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cyberpunk LED Helmet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D stage, a slim spec strip on top, a control tray docked bottom (side on wide screens). Single dark look by choice: a shop light-box for a gloss-black part. */
:root {
  color-scheme: dark;
  --ground: #101215;      /* graphite with a cold bias */
  --panel: #171a1f;
  --line: #2a2f37;
  --ink: #e7e9ec;
  --muted: #8d949e;
  --led: #ff2a1f;         /* WS2812B red, used only for light */
  --led-dim: #5a1612;
  --f-display: "Saira Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
.app { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
header { padding-block: 12px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; border-bottom: 1px solid var(--line); z-index: 2; background: var(--ground); }
h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.55rem; letter-spacing: .04em; text-transform: uppercase; text-wrap: balance; }
h1 span { color: var(--led); }
.spec { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--f-mono); font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.spec b { color: var(--ink); font-weight: 500; }
#stage { position: relative; min-height: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hint { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 10px; font-family: var(--f-mono); font-size: .7rem; color: var(--muted); pointer-events: none; }
#pick { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 12px; max-width: min(300px, 70%); background: color-mix(in srgb, var(--panel) 92%, transparent);
  border: 1px solid var(--line); border-left: 3px solid var(--led); padding: 10px 12px; font-size: .82rem; line-height: 1.45; }
#pick .nm { font-family: var(--f-display); font-size: 1.05rem; letter-spacing: .05em; text-transform: uppercase; }
#pick .meta { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tray { padding-block: 10px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 1px solid var(--line); background: var(--panel); display: grid; gap: 10px; z-index: 2; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lbl { font-family: var(--f-display); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
button { font: 500 .8rem var(--f-body); color: var(--ink); background: transparent; border: 1px solid var(--line); padding: 6px 11px; border-radius: 3px; cursor: pointer; }
button[aria-pressed="false"] { color: var(--muted); border-style: dashed; }
button.act { border-color: var(--led-dim); }
button.act[aria-pressed="true"] { background: var(--led-dim); border-color: var(--led); }
button:focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }
@media (min-width: 900px) {
  .app { grid-template-columns: 1fr 300px; grid-template-rows: auto 1fr; }
  header { grid-column: 1 / -1; }
  .tray { grid-row: 2; grid-column: 2; border-top: 0; border-left: 1px solid var(--line); align-content: start; }
  .row { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <h1>Cyberpunk <span>LED</span> Helmet</h1>
    <div class="spec"><span><b>62 cm</b> head</span><span><b>17</b> STL files</span><span><b>~1.1 kg</b> PETG</span><span>every part fits <b>256 mm</b></span></div>
  </header>
  <div id="stage">
    <div id="pick"><div class="nm">Tap a part</div><div class="meta">Shows its file and print size</div></div>
    <div class="hint">Drag to orbit · pinch or scroll to zoom</div>
  </div>
  <div class="tray">
    <div class="row"><span class="lbl">View</span>
      <button id="b-led" class="act" aria-pressed="true">LEDs on</button>
      <button id="b-explode" class="act" aria-pressed="false">Exploded</button>
      <button id="b-spin" class="act" aria-pressed="false">Turntable</button>
    </div>
    <div class="row" id="toggles"><span class="lbl">Parts</span></div>
    <div class="row"><span class="lbl">Camera</span>
      <button data-cam="front">Front</button><button data-cam="side">Side</button><button data-cam="q">¾</button><button data-cam="rear">Rear</button>
    </div>
  </div>
</div>

      FN[f * 3] = nx / L; FN[f * 3 + 1] = ny / L; FN[f * 3 + 2] = nz / L; vf[a].push(f); vf[b].push(f); vf[c].push(f);
    }
    const pos = new Float32Array(nf * 9), nor = new Float32Array(nf * 9), COS = Math.cos(32 * Math.PI / 180);
    for (let f = 0; f < nf; f++) for (let k = 0; k < 3; k++) {
      const v = idx[f * 3 + k]; let sx = 0, sy = 0, sz = 0;
      for (const g of vf[v]) { const d = FN[f * 3] * FN[g * 3] + FN[f * 3 + 1] * FN[g * 3 + 1] + FN[f * 3 + 2] * FN[g * 3 + 2]; if (d > COS) { sx += FN[g * 3]; sy += FN[g * 3 + 1]; sz += FN[g * 3 + 2]; } }
      const L = Math.hypot(sx, sy, sz) || 1, o = (f * 3 + k) * 3;
      pos[o] = P[v * 3]; pos[o + 1] = P[v * 3 + 1]; pos[o + 2] = P[v * 3 + 2]; nor[o] = sx / L; nor[o + 1] = sy / L; nor[o + 2] = sz / L;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3)); g.setAttribute("normal", new THREE.BufferAttribute(nor, 3));
    g.computeBoundingBox(); return g;
  }

  const root = new THREE.Group(); root.rotation.x = -Math.PI / 2; scene.add(root);   // model is Z-up, Y-forward
  const groups = {}, pickables = [], glowMeshes = [];
  const center = new THREE.Vector3(0, 0, -20);
  for (const [name, rec] of Object.entries(D)) {
    if (name.startsWith("_")) continue;
    const grp = name.split("_")[0];
    const g = geometryFrom(rec);
    const isGlow = grp === "glow";
    const mesh = new THREE.Mesh(g, isGlow ? mats.glow : mats[matFor[grp] || "satin"]);
    const c = new THREE.Vector3(); g.boundingBox.getCenter(c);
    mesh.userData = { key: name, home: new THREE.Vector3(), dir: c.clone().sub(center) };
    if (isGlow) { glowMeshes.push(mesh); mesh.renderOrder = 2; }
    else pickables.push(mesh);
    const gk = isGlow ? (name === "glow_1" ? "guard" : name === "glow_0" ? "holder" : "pods") : grp;
    (groups[gk] = groups[gk] || []).push(mesh); root.add(mesh);
  }
  // glow pieces explode with their host part
  const host = { glow_0: "visor_0", glow_1: "guard_0", glow_2: "pods_0", glow_3: "pods_1" };
  // tubes rebuilt from their centre-lines
  const T = D._tubes; groups.tubes = [];
  for (const path of T.paths) {
    const pts = path.map(p => new THREE.Vector3(p[0], p[1], p[2]));
    const curve = new THREE.CatmullRomCurve3(pts);
    const m = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(24, pts.length * 2), T.tube_radius, 14, false), mats.tube);
    m.userData = { key: "tubes", home: new THREE.Vector3(), dir: new THREE.Vector3(0, -1, 0.6) };
    groups.tubes.push(m); pickables.push(m); root.add(m);
  }
  const eye = D.glow_0 ? (() => { const g = groups.holder.find(m => m.userData.key === "glow_0").geometry; const c = new THREE.Vector3(); g.boundingBox.getCenter(c); return c; })() : new THREE.Vector3(-31, 120, 0);
  eyeLight.position.set(eye.x, eye.z, -eye.y - 30);

  // UI: part toggles
  const tog = document.getElementById("toggles");
  for (const [k, label] of GROUPS) {
    if (!groups[k]) continue;
    const b = document.createElement("button"); b.id = "t-" + k; b.textContent = label; b.setAttribute("aria-pressed", "true");
    b.onclick = () => { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", String(on)); groups[k].forEach(m => m.visible = on); if (k === "visor") (groups.holder || []).forEach(m => { if (m.userData.key === "glow_0") m.visible = on || ledOn; }); };
    tog.appendChild(b);
  }
  let ledOn = true, exploded = false, spin = false, ex = 0;
  const bLed = document.getElementById("b-led"), bEx = document.getElementById("b-explode"), bSp = document.getElementById("b-spin");
  bLed.onclick = () => { ledOn = !ledOn; bLed.setAttribute("aria-pressed", String(ledOn)); bLed.textContent = ledOn ? "LEDs on" : "LEDs off"; mats.glow.color.set(ledOn ? 0xff2a1f : 0x3a0e0c); eyeLight.intensity = ledOn ? 2.2 : 0; };
  bEx.onclick = () => { exploded = !exploded; bEx.setAttribute("aria-pressed", String(exploded)); };
  bSp.onclick = () => { spin = !spin; bSp.setAttribute("aria-pressed", String(spin)); controls.autoRotate = spin; };
  const cams = { front: [0, 60, -1150], side: [1150, 60, 0], q: [780, 220, -780], rear: [-500, 380, 1000] };
  let camGoal = null;
  document.querySelectorAll("[data-cam]").forEach(b => b.onclick = () => { camGoal = new THREE.Vector3(...cams[b.dataset.cam]); });
  camera.position.set(...cams.q);

  // tap to identify
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
  const pick = document.getElementById("pick");
  renderer.domElement.addEventListener("pointerdown", e => down = [e.clientX, e.clientY]);
  renderer.domElement.addEventListener("pointerup", e => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(pickables.filter(m => m.visible), false)[0];
    if (!hit) return;
    const info = INFO[hit.object.userData.key] || INFO.tubes;
    pick.innerHTML = `<div class="nm">${info.name}</div><div>${info.how}</div><div class="meta">${info.meta}</div>`;
  });

  function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix(); }
  new ResizeObserver(resize).observe(stage); resize();
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function frame(t) {
    ex += ((exploded ? 1 : 0) - ex) * (reduce ? 1 : 0.12);
    for (const list of Object.values(groups)) for (const m of list) {
      let d = m.userData.dir; const hk = host[m.userData.key];
      if (hk) { const h = root.children.find(o => o.userData.key === hk); if (h) d = h.userData.dir; }
      m.position.copy(d).multiplyScalar(ex * 0.55);
    }
    if (camGoal) { camera.position.lerp(camGoal, reduce ? 1 : 0.12); if (camera.position.distanceTo(camGoal) < 2) camGoal = null; }
    if (ledOn && !reduce) mats.glow.color.setRGB(1, 0.12 + 0.05 * Math.sin(t / 380), 0.08);
    controls.update(); renderer.render(scene, camera); requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
